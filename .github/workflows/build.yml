
name: Build QMI core

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host QMUX tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure
        run: >
          cmake -S . -B build-host -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DQMI_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-host --parallel

      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  android-arm64:
    name: Android 15 ARM64 library
    runs-on: ubuntu-24.04
    needs: host-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Configure Android arm64
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DCMAKE_BUILD_TYPE=Release \
            -DQMI_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-android --parallel

      - name: Package artifact
        run: |
          mkdir -p dist
          cp build-android/libj5qmi_core.a dist/
          cp README.md dist/
          tar -czf j5xnlte-qmi-core-android15-arm64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: j5xnlte-qmi-core-android15-arm64
          path: j5xnlte-qmi-core-android15-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
